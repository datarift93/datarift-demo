[project]
name = "datarift-pipeline"
version = "0.1.0"
description = "Data generator and import pipeline for datarift-demo"
readme = "README.md"
authors = [
    { name = "Kamil M", email = "datarift93@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "pydantic>=2.14.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[project.scripts]
datarift-pipeline = "datarift_pipeline.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
